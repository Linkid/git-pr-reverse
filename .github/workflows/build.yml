name: Build
on:
  push:
    branches:
      - 'main'
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build:
    name: Build the extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Install the dependencies
        run: npm ci
      - name: Display web-ext version
        run: npx web-ext --version

      - name: Build with web-ext
        run: npm run build

      - name: Upload the artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: web-ext-artifacts/*.zip
          name: git-pr-reverse

  release:
    name: Create the GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download the extension
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: git-pr-reverse
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$TAG" '
            /^## / { if (found) exit; found = ($2 == tag) ; next }
            found
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## $TAG' section"
            exit 1
          fi

          gh release create "$TAG" dist/*.zip --verify-tag --title "$TAG" \
            --notes-file notes.md
