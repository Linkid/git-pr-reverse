name: Build
on: [push]

permissions:
  contents: read

jobs:
  lint:
    name: Lint the code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Install the dependencies
        run: npm ci

      # eslint
      - name: Lint the scripts
        run: npm run lint

      # web-ext
      - name: Display web-ext version
        run: npx web-ext --version
      # Firefox ignores Chrome's "service_worker" key and web-ext lint warns
      # about it: BACKGROUND_SERVICE_WORKER_IGNORED. Strip it before linting
      - name: Drop Chrome-only service_worker key for Firefox lint
        run: |
          jq 'del(.background.service_worker)' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json
      - name: Lint the webextension
        run: npm run lint:webext -- --warnings-as-errors

  test:
    name: Run the tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true

      - name: Run the tests with coverage
        run: npm run test:coverage

  build:
    name: Build the extension
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Install the dependencies
        run: npm ci
      - name: Display web-ext version
        run: npx web-ext --version

      - name: Build with web-ext
        run: npm run build

      - name: Upload the artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: web-ext-artifacts/*.zip
          name: git-pr-reverse

  release:
    name: Create the GitHub release
    if: github.ref_type == 'tag'
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download the extension
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: git-pr-reverse
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$TAG" '
            /^## / { if (found) exit; found = ($2 == tag) ; next }
            found
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## $TAG' section"
            exit 1
          fi

          # "Full Changelog": the compare link with the previous version, the
          # next "## " heading of CHANGELOG.md (if any), then the section,
          # anchored by GitHub's heading slug ("## 1.4.1 (2026-11-11)" ->
          # "#141-2026-11-11")
          repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          heading=$(awk -v tag="$TAG" '$1 == "##" && $2 == tag { print; exit }' CHANGELOG.md)
          previous=$(awk -v tag="$TAG" '
            $1 == "##" { if (found) { print $2; exit } found = ($2 == tag) }
          ' CHANGELOG.md)
          anchor=$(echo "${heading#\#\# }" | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9 -]//g; s/ /-/g')
          changelog="[changelog]($repo/blob/main/CHANGELOG.md#$anchor)"
          if [ -n "$previous" ]; then
            full="$repo/compare/$previous...$TAG / $changelog"
          else
            full="$changelog"
          fi
          printf '\n**Full Changelog**: %s\n' "$full" >> notes.md

          gh release create "$TAG" dist/*.zip --verify-tag --title "$TAG" \
            --notes-file notes.md
